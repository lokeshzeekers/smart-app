version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smart_user
      POSTGRES_PASSWORD: smart_pass
      POSTGRES_DB: smart_airway
    ports:
      - "5432:5432"
    volumes:
      - smart_pg_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_user -d smart_airway"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: smart_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://smart_user:smart_pass@postgres:5432/smart_airway
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_string}
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-*}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-5}
      # Real OTP delivery in production - set these in a .env file next to
      # this docker-compose.yml (docker compose reads it automatically).
      # A free Gmail App Password works: see backend/.env.example.
      # If left unset, the backend falls back to logging the OTP instead
      # of emailing it - that's the "DEV ONLY" message you're seeing.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-SMArT Airway Training <no-reply@smart-airway.app>}
    ports:
      - "4000:4000"

volumes:
  smart_pg_data:
